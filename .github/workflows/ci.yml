name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # The package is consumed by KONTUR through its published tarball, so a
      # file missing from `files` breaks the consumer and nothing here. Pack
      # and assert the entry points exist.
      - name: Verify packed contents
        run: |
          npm pack --silent
          tar -tzf monolithrobotics-isoline-*.tgz | sort | tee packed.txt
          grep -q 'package/dist/isoline.js' packed.txt
          grep -q 'package/dist/index.d.ts' packed.txt
