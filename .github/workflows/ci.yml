name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # Consumers get the published tarball, so a file missing from `files`
      # breaks them and nothing here. Pack and assert the entry points exist.
      - name: Verify packed contents
        run: |
          npm pack --silent
          tar -tzf monolithrobotics-isoline-*.tgz | sort | tee packed.txt
          grep -q 'package/dist/isoline.js' packed.txt
          grep -q 'package/dist/index.d.ts' packed.txt

  ci-ok:
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          bad = {k: v["result"] for k, v in json.loads(os.environ["NEEDS"]).items()
                 if v["result"] not in ("success", "skipped")}
          for k, r in sorted(bad.items()):
              print(f"::error::{k}: {r}")
          sys.exit(1 if bad else 0)
          PY
